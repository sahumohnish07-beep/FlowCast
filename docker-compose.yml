services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowcast-api
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - flowcast-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowcast-dashboard
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.port",
        "8501",
        "--server.address",
        "0.0.0.0",
        "--browser.gatherUsageStats",
        "false",
      ]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flowcast-net

networks:
  flowcast-net:
    driver: bridge

